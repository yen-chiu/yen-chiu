name: Latest blog post workflow

# 三种触发，互为兜底：
# - schedule：每周一早上（北京时间）自动抓一次
# - workflow_dispatch：想立刻更新时手动跑
# - push：仓库有别的改动时就顺手同步一次（README 本身不触发，否则会绕成环）
on:
  schedule:
    - cron: '17 22 * * 0'
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

# 同时只跑一个，避免两次提交互相覆盖
concurrency:
  group: blog-post-workflow
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    name: Update repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull in recent blog posts
        # 用固定版本号而不是 @master：第三方 action 的 master 随时会变
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: 'https://yenchiu.com/feed.xml'
          max_post_count: '5'
          commit_message: 'chore: 同步博客最新文章'
          retry_count: '3'
          retry_wait_time: '5000'
