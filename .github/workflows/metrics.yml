name: Metrics

# 用 lowlighter/metrics 生成一张「个人仪表盘」卡片，提交为本仓库根目录的 github-metrics.svg，
# README 直接引用它。
#
# 两种模式：
# - 仓库里配了 secret METRICS_TOKEN（带 repo 权限的个人 token）→ 完整版：语言分布 + 编码习惯
# - 没配 → 基础版：提交 / PR / Star / 代码行数等，不显示会报错的语言与习惯插件
#
# - workflow_dispatch：想立刻刷新时手动跑
# - schedule：每天北京时间 10:00 自动刷新一次
# - push：本仓库有改动时顺手刷新（README / 生成的 svg 不触发，避免自己触发自己）
on:
  schedule:
    # UTC 02:00 == 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "github-metrics.svg"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否配置了 METRICS_TOKEN
        id: token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=basic" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成 metrics 卡片（完整版）
        if: steps.token.outputs.mode == 'full'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yen-chiu
          filename: github-metrics.svg
          template: classic
          config_display: large
          config_timezone: Asia/Shanghai
          config_padding: 5%, 8%
          config_animations: no
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      - name: 生成 metrics 卡片（基础版）
        if: steps.token.outputs.mode == 'basic'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yen-chiu
          filename: github-metrics.svg
          template: classic
          config_display: large
          config_timezone: Asia/Shanghai
          config_padding: 5%, 8%
          config_animations: no
          base: header, activity, community, repositories
          plugin_lines: yes
